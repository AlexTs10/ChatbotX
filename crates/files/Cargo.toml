[package]
name = "chatbotx-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
# HMAC-SHA256 for presigned URLs on the local backend (DECISIONS P2.9).
hmac = "0.13"
http = "1"
# Header-only image sizes (raster formats); SVG is parsed with std.
imagesize = "0.15"
# Local file system by default, S3 by config.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws"] }
# Already in the tree through object_store/aws; used for `ReqwestFetcher`.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = { version = "0.7", default-features = false }
tracing.workspace = true
# WHATWG URL parsing (redirect targets, file names, endpoints).
url = "2"

[dev-dependencies]
base64 = "0.22"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
