[package]
name = "chatbotx-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chatbotx-db = { workspace = true }
# `Clock` and the keyed lock `LockMap` (P2.7: replaces the interim dispatch lock map).
chatbotx-kv = { workspace = true }
# ISO-8601 instants (idempotency keys) and calendar math; `chrono-tz` for the send-time zone.
chrono = { workspace = true, features = ["std"] }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
# `RecordingLog` in tests/support: a layer that keeps message + fields.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
