[package]
name = "chatbotx-business"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Business services (`packages/business/src/<domain>`), one module per domain (P3.6+).
[dependencies]
# API channel tokens (`generateApiChannelToken`: base64url of 32 random bytes).
base64 = "0.22"
# Local day and time of an instant in the workspace time zone (`Intl.DateTimeFormat`).
chrono = { workspace = true, features = ["std"] }
chrono-tz = { workspace = true }
chatbotx-core = { workspace = true }
chatbotx-db = { workspace = true }
chatbotx-jobs = { workspace = true }
chatbotx-kv = { workspace = true }
chatbotx-rt = { workspace = true }
# P3.6-D2 contacts: E.164 normalization (libphonenumber-js).
phonenumber = { workspace = true }
# SSRF guard DoH lookup (`fetch("https://1.1.1.1/dns-query")`); same client as crates/files.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Random token bytes (`crypto.getRandomValues`).
ring = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Task-local audit actor (`withAuditContext`, P3.6-X1).
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
# Chat links of inboxes (`new URL` + `searchParams.set`).
url = { workspace = true }

[dev-dependencies]
chatbotx-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
