[package]
name = "chatbotx-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Job handlers of `apps/worker` (Q.W1: chat, integration `sendFlow`, default),
# run by the `chatbotx-jobs` runtime inside `chatbotx-server`.
[dependencies]
chatbotx-business = { workspace = true }
chatbotx-core = { workspace = true }
chatbotx-db = { workspace = true }
# WhatsApp media: the file store (inbound copies, outbound re-hosting).
chatbotx-files = { workspace = true }
chatbotx-jobs = { workspace = true }
chatbotx-kv = { workspace = true }
chatbotx-rt = { workspace = true }
bytes = { workspace = true }
# Smart-delay job ids and the on-shift check (working-hours zone).
chrono = { workspace = true, features = ["std"] }
chrono-tz = { workspace = true }
# API channel callback POST (same client as chatbotx-business).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# API channel HMAC-SHA256 signature and the delivery id.
ring = { workspace = true }
# Meta catalog: the error sanitizer and the remote product URLs.
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
