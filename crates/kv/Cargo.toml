[package]
name = "chatbotx-kv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only inspection helpers (P2.7 spec 3.2): TTLs, raw values, key lists.
test-util = []

[dependencies]
chatbotx-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 fingerprint of the Moosend API key (`moosend` module, K5).
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
chatbotx-kv = { path = ".", features = ["test-util"] }
# T1: `DateTime<Utc>` round-trip through the cache.
chrono = { workspace = true, features = ["serde", "std"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
