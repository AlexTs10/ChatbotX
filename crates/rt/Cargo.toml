[package]
name = "chatbotx-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `ws` = WebSocket upgrade (pulls tokio-tungstenite, sha1, base64); spec 3.1.
axum = { workspace = true, features = ["ws"] }
# JWT segments (base64url, no padding); same version as crates/files.
base64 = "0.22"
# Revoke marker (`DurableKv`), `Clock`, presence leases (`kv::Presence`).
chatbotx-kv = { workspace = true }
# `split` of the upgraded socket into a reader and a writer half.
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"] }
# HS256 for the realtime tokens (spec 3.1; no `jsonwebtoken`); same version as crates/files.
hmac = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
chatbotx-db = { workspace = true }
chatbotx-kv = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
# WebSocket client for the gateway tests (spec 4.2); the version axum 0.8.9 uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
# `RecordingLog` in tests/support.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
