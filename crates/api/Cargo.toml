[package]
name = "chatbotx-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
# Unverified JWT `aud` peek of a mobile access token (base64url segments); same version as crates/rt.
base64 = "0.22"
# Business services behind the public handlers (P3.6+).
chatbotx-business.workspace = true
# `isPlaceholderEmail` (sign-up gate).
chatbotx-core.workspace = true
# Token scope names (`WORKSPACE_API_TOKEN_SCOPES`) and the auth repositories.
chatbotx-db.workspace = true
# API rate limits (`assertApiNotRateLimited`) and the clock.
chatbotx-kv.workspace = true
# better-auth cookie signatures and the email verification JWT (HS256); same version as crates/rt.
hmac = "0.13"
# Session tokens and password salts (OS randomness).
ring.workspace = true
# better-auth password hashes (scrypt N=16384, r=16, p=1, 64 bytes).
scrypt = { version = "0.12", default-features = false }
serde_json.workspace = true
# `hashToken` (SHA-256 hex of a workspace API token).
sha2.workspace = true
# NFKC normalization of passwords (better-auth `password.normalize("NFKC")`).
icu_normalizer.workspace = true
# SMTP client (mail) and blocking scrypt work.
tokio = { workspace = true, features = ["io-util", "net", "rt"] }
tracing.workspace = true
# Origin parsing of the trusted-origin checks (WHATWG URL origins).
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower.workspace = true

[lints]
workspace = true
