[package]
name = "chatbotx-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
# Unverified JWT `aud` peek of a mobile access token (base64url segments); same version as crates/rt.
base64 = "0.22"
# Token scope names (`WORKSPACE_API_TOKEN_SCOPES`) and the auth repositories.
chatbotx-db.workspace = true
# API rate limits (`assertApiNotRateLimited`) and the clock.
chatbotx-kv.workspace = true
serde_json.workspace = true
# `hashToken` (SHA-256 hex of a workspace API token).
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower.workspace = true

[lints]
workspace = true
