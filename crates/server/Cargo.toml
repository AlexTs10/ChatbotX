[package]
name = "chatbotx-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "chatbotx-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chatbotx-api.workspace = true
# Event-bus subscribers and the audit writer behind `ApiState` (P3.6-X1).
chatbotx-business.workspace = true
# The platform WhatsApp credential (encryption) and the broker host.
chatbotx-core.workspace = true
# Realtime gateway (P2.8): the revoke marker lives in SQLite (`kv.durable`).
chatbotx-db.workspace = true
# The file store and its `/files/{key}` route (P3.6-D2).
chatbotx-files.workspace = true
# The job store behind `ApiState` (jobs enqueue, audit records; P3.6-X1).
chatbotx-jobs.workspace = true
chatbotx-kv.workspace = true
chatbotx-rt.workspace = true
# `window.__ENV` of the SPA index (P4).
serde_json.workspace = true
# The chat / integration / default workers (Q.W1).
chatbotx-worker.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
# The SPA fallback forwards API paths to the public API router (P4).
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[lints]
workspace = true
