[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Internal crates.
chatbotx-api = { path = "crates/api" }
chatbotx-core = { path = "crates/core" }
chatbotx-db = { path = "crates/db" }
chatbotx-files = { path = "crates/files" }
chatbotx-jobs = { path = "crates/jobs" }
chatbotx-kv = { path = "crates/kv" }
chatbotx-rt = { path = "crates/rt" }

# External crates. Default features are off; enable only what a crate uses.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Unix ms <-> calendar and the IANA tz database for the SQL tz_* functions (P2.3 spec 3.5).
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }
# Rust `regex` for the SQL regexp / regexp_replace functions (P2.3 spec 3.3-3.4); regex-automata is already in the tree.
regex = "1"
# Bundled SQLite (DECISIONS P2.2 user answer). `cache` = prepared-statement cache (P2.3 spec 2.2).
rusqlite = { version = "0.42", default-features = false, features = ["bundled", "cache"] }
# Job payload types (P2.6); serde_derive is already in the tree through serde_json users.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
# Migration checksums (P2.3 spec 4.1); same version as crates/files.
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
# P3.1 core: same versions as crates/files (already in the tree).
futures = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
url = "2"
# P3.1 core: NFD for accent folding (`normalize("NFD")`); already in the tree through url -> idna.
icu_normalizer = "2"
# P3.1 core: AES-256-GCM, HMAC-SHA256, SHA-256 and OS randomness for packages/encryption and utils/crypto;
# already in the tree through rustls.
ring = "0.17"
# P3.1 core: stored-image re-encoding (packages/utils image-optimize; sharp/libvips in the original).
# Decode JPEG/PNG/WebP + EXIF orientation + Lanczos3 resize; JPEG 4:4:4 encode; lossy WebP for avatars (libwebp, C).
bytes = "1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
# JPEG pixels: zune-jpeg (image's decoder) misdecodes some valid 4:2:0
# optimized-Huffman files; jpeg-decoder agrees with libjpeg.
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
webp = { version = "0.3", default-features = false }
# P3.4 flow-config: E.164 validity of call-button numbers (libphonenumber-js
# `parsePhoneNumberFromString(...).isValid()`); Google metadata built in.
phonenumber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
